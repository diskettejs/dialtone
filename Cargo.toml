[package]
name = "dialtone"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.0", default-features = false, features = [
  "napi10",
  "async",
  "web_stream",
] }
napi-derive = "3.6.2"

zenoh = { version = "1.9.0", features = ["unstable", "internal"] }
zenoh-ext = { version = "1.9.0", features = ["unstable", "internal"] }
zenoh-config = { version = "1.9.0" }

async-trait = "0.1.89"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
napi-build = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
