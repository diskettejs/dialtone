[package]
name = "dialtone"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
napi = { version = "3", default-features = false, features = [
  "chrono_date",
  "napi10",
  "async",
  "web_stream",
] }
napi-derive = "3"

zenoh = { version = "1.9.0", features = ["unstable", "internal"] }
zenoh-ext = { version = "1.9.0", features = ["unstable", "internal"] }
zenoh-config = { version = "1.9.0" }

futures = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
