name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'index.d.ts'
      - 'binding.d.ts'
      - 'typedoc.json'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# The native-build CI (CI.yml) ignores docs/**; this workflow owns the docs
# site and never compiles Rust — TypeDoc and Twoslash are type-only.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build docs (TypeDoc + VitePress)
        run: pnpm docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
